services:
  - type: web
    name: library-ghostitzer
    env: python
    plan: free
    build:
      command: "pip install -r requirements.txt && npm install && npm run build && python manage.py collectstatic --noinput"
    start:
      command: "gunicorn library_ghostitzer.wsgi:application"
    release:
      command: "python manage.py migrate"
    health_check:
      path: "/"
    env:
      vars:
        - key: DJANGO_ENV
          value: "production"
        - key: DATABASE_URL
          from_database:
            name: library-ghostitzer-db
            property: connectionString
        - key: SECRET_KEY
          generate_value: true
        - key: DEBUG
          value: "False"
        - key: ALLOWED_HOSTS
          value: "library-ghostitzer.onrender.com"
        - key: CSRF_TRUSTED_ORIGINS
          value: "https://library-ghostitzer.onrender.com"
        - key: CORS_ALLOW_ALL_ORIGINS
          value: "False"


databases:
  - name: library-ghostitzer-db
    plan: free
    database_name: library_ghostitzer
    user: library_ghostitzer
