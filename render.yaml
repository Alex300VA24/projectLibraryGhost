services:
  - type: web
    name: library-ghostitzer
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && npm install && npm run build && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn library_ghostitzer.wsgi:application"
    healthCheckPath: "/"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_ENV
        value: "production"
      - key: DATABASE_URL
        sync: false
        value: "postgresql://USER:PASSWORD@HOST:5432/postgres"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "library-ghostitzer.onrender.com,localhost,127.0.0.1,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://library-ghostitzer.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: USE_SUPABASE_STORAGE
        value: "True"
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false
      - key: SUPABASE_S3_BUCKET
        value: "library-ghostitzer"
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        value: "us-east-1"
