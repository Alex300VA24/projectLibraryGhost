<div x-show="showModalResetPassword" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" @click.self="showModalResetPassword = false" @keydown.escape.window="showModalResetPassword = false" role="dialog" aria-modal="true" aria-labelledby="modal-restablecer-password" style="display:none">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center" @click.stop>
    <div class="w-14 h-14 rounded-full bg-yellow-100 flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-key text-yellow-500 text-xl"></i></div>
    <h3 id="modal-restablecer-password" class="text-2xl font-display font-700 text-ink-900 mb-2 flex items-center justify-center gap-2"><i class="fa-solid fa-key text-brand-600 text-lg" aria-hidden="true"></i>Restablecer Contraseña</h3>
    <p class="text-ink-500 text-sm mb-6">La contraseña se cambiará a <strong>"Cambiar123++"</strong>. ¿Continuar?</p>
    <div class="flex gap-3">
      <button @click="confirmarResetPassword()" :disabled="isActionLoading('resetPassword')" :aria-busy="isActionLoading('resetPassword')" class="btn-primary flex-1 py-3 text-sm font-bold shadow-lg shadow-brand-200 disabled:cursor-not-allowed disabled:opacity-60"><i class="fa-solid" :class="isActionLoading('resetPassword') ? 'fa-spinner fa-spin' : 'fa-check'"></i> <span x-text="isActionLoading('resetPassword') ? 'Restableciendo...' : 'Sí, restablecer'"></span></button>
      <button @click="showModalResetPassword = false" :disabled="isActionLoading('resetPassword')" class="btn-ghost flex-1 disabled:cursor-not-allowed disabled:opacity-60" aria-label="Cerrar modal"><i class="fa-solid fa-xmark mr-1"></i> Cancelar</button>
    </div>
  </div>
</div>
