              </div>
            </div>
            <p class="text-xs text-ink-500">Gastos de esta semana</p>
          </div>
          <div class="dashboard-metric-card fade-up-d1 p-3 min-h-[9.5rem] flex flex-col justify-between">

              </div>

              </div>

                <div class="text-xl font-display font-800 text-ink-900" x-text="'S/ ' + ((dashboardData.gastosMes || 0)).toFixed(2)"></div>

              </div>

            <p class="text-xs text-ink-500">Gastos acumulados del mes</p>

                <div class="text-xl font-display font-800 text-ink-900" x-text="'S/ ' + ((dashboardData.gastosTotal || 0)).toFixed(2)"></div>

              <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white shrink-0" style="background:linear-gradient(135deg,#7c3aed,#a78bfa);">

              <i class="fa-solid fa-plus-circle text-lg"></i>
              <span>Registrar Gasto</span>

              <span>Reporte de Gastos</span>
            </button>
          </div>

            <input x-model="filtroFechaGasto" type="date" class="inp w-auto">

              <option value="Operativo">Operativo</option>
              <option value="Mantenimiento">Mantenimiento</option>

              <tbody>
                <template x-for="gasto in gastosPg.items" :key="gasto.id">
                  <tr class="tbl-row">
                    <td class="font-mono text-xs text-ink-500 font-semibold" x-text="'GAS-' + String(gasto.id).padStart(4, '0')"></td>
                    <td class="font-medium text-ink-800" x-text="gasto.concepto"></td>
                    <td><span class="badge" :class="gasto.tipo === 'Fijo' ? 'bg-blue-100 text-blue-700' : gasto.tipo === 'Variable' ? 'bg-sky-100 text-sky-700' : gasto.tipo === 'Operativo' ? 'bg-special-100 text-special-700' : 'bg-ink-100 text-ink-600'"><span class="cb-icon" style="display:none"><i :class="gasto.tipo === 'Fijo' ? 'fa-solid fa-lock' : gasto.tipo === 'Variable' ? 'fa-solid fa-arrows-rotate' : gasto.tipo === 'Operativo' ? 'fa-solid fa-gears' : 'fa-solid fa-wrench'" class="mr-1"></i> </span><span x-text="gasto.tipo"></span></span></td>
                    <td class="font-display font-700 text-ink-900" x-text="'S/ ' + gasto.monto.toFixed(2)"></td>
                    <td class="text-ink-400 text-xs" x-text="gasto.fecha"></td>

                    </td>

            <p class="pagination-info">Mostrando <span x-text="((gastosPg.currentPage - 1) * PER_PAGE) + 1"></span>-<span x-text="Math.min(gastosPg.currentPage * PER_PAGE, gastosPg.total)"></span> de <span x-text="gastosPg.total"></span></p>
            <div class="pagination-btns">
              <button @click="gastosPage = 1" :disabled="gastosPg.currentPage === 1" class="page-btn"><i class="fa-solid fa-angles-left text-xs"></i></button>
              <button @click="gastosPage = Math.max(1, gastosPage - 1)" :disabled="gastosPg.currentPage === 1" class="page-btn"><i class="fa-solid fa-chevron-left text-xs"></i></button>
              <template x-for="p in getPageRange(gastosPg.currentPage, gastosPg.totalPages)" :key="'gastos-'+p">
                <button x-show="p !== '...'" @click="gastosPage = p" :class="p === gastosPg.currentPage ? 'page-active' : ''" class="page-btn" x-text="p"></button>
                <span x-show="p === '...'" class="page-ellipsis">...</span>
              </template>
              <button @click="gastosPage = Math.min(gastosPg.totalPages, gastosPage + 1)" :disabled="gastosPg.currentPage === gastosPg.totalPages" class="page-btn"><i class="fa-solid fa-chevron-right text-xs"></i></button>
              <button @click="gastosPage = gastosPg.totalPages" :disabled="gastosPg.currentPage === gastosPg.totalPages" class="page-btn"><i class="fa-solid fa-angles-right text-xs"></i></button>
            </div>
          </div>
          <div x-show="gastosPg.total === 0" class="px-6 py-12 text-center text-ink-400">
            <i class="fa-solid fa-receipt text-4xl mb-3 inline-block"></i>
            <p class="font-display font-600">No se encontraron gastos</p>
          </div>
        </div>
